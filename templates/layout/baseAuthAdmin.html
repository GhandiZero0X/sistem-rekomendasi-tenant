<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Injourney {% block title %}{% endblock %}</title>
    <link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='static_admin/images/logos/logo.png') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='static_admin/css/styles.min.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/loading.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
        data-sidebar-position="fixed" data-header-position="fixed">

        <!-- Loading Page Animation -->
        <div id="loading-page">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/logo_bagian_1.png') }}" alt="Logo Bagian 1" class="logo-part part-1" />
                <img src="{{ url_for('static', filename='images/logo_bagian_2.png') }}" alt="Logo Bagian 2" class="logo-part part-2" />
                <img src="{{ url_for('static', filename='images/logo_bagian_3.png') }}" alt="Logo Bagian 3" class="logo-part part-3" />
                <img src="{{ url_for('static', filename='images/logo_bagian_4.png') }}" alt="Logo Bagian 4" class="logo-part part-4" />
            </div>
        </div>

        <div class="position-relative overflow-hidden radial-gradient min-vh-100 d-flex align-items-center justify-content-center">
            <div class="d-flex align-items-center justify-content-center w-100">
                <div class="row justify-content-center w-100">
                    <div class="col-md-8 col-lg-6 col-xxl-3">
                        <div class="card mb-0">
                            {% block content %}
                            {% endblock %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='static_admin/libs/jquery/dist/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='static_admin/libs/bootstrap/dist/js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/loading.js') }}"></script>
    {% block scripts %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
</body>

</html>
