<!-- templates/pages/edit-tenant.html -->
{% extends "layout/baseEditAddAdmin.html" %}
{% block title %}- Edit Tenant{% endblock %}

{% block content %}
<div class="card-body">
  <div class="d-flex align-items-center justify-content-between mb-5">
    <h5 class="card-title fw-semibold mb-0 d-flex align-items-center">
      <a href="{{ url_for('routes.tenant_dashboard') }}" class="me-4">
        <i class="bi bi-arrow-left-circle fs-5"></i>
      </a>
      Edit Tenant ID #{{ tenant.id }}
    </h5>
  </div>

  <div class="card-body pt-0">
    <form action="{{ url_for('routes.editTenant') }}?id={{ tenant.id }}" method="POST" enctype="multipart/form-data">
      
      <!-- Nama Brand -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Nama Brand</label>
        <input
          type="text"
          name="nama_brand"
          class="form-control"
          value="{{ tenant.nama_brand }}"
          required
        />
      </div>

      <!-- Jenis Usaha -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Jenis Usaha</label>
        <select name="jenis_usaha" class="form-select" required>
          {% set jenis_opsi = ["Event & Promotion", "Food & Beverage", "Lounge", "Retail", "Services"] %}
          {% for opsi in jenis_opsi %}
            <option value="{{ opsi }}" {% if tenant.jenis_usaha == opsi %}selected{% endif %}>{{ opsi }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Lokasi -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Lokasi</label>
        <input
          type="text"
          name="lokasi"
          class="form-control"
          value="{{ tenant.lokasi }}"
        />
      </div>

      <!-- Rating -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Rating</label>
        <input
          type="number"
          step="0.1"
          name="rating"
          class="form-control"
          value="{{ tenant.rating }}"
        />
      </div>

      <!-- Total Review -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Total Review</label>
        <input
          type="number"
          name="total_review"
          class="form-control"
          value="{{ tenant.total_review }}"
        />
      </div>

      <!-- Rentang Harga -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Rentang Harga</label>
        <select name="rentang_harga" class="form-select" required>
          {% for opsi in ["murah", "sedang", "mahal"] %}
            <option value="{{ opsi }}" {% if tenant.rentang_harga == opsi %}selected{% endif %}>{{ opsi|capitalize }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Upload Gambar -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Gambar</label>
        <input
          type="file"
          name="gambar"
          class="form-control"
          accept=".png,.jpg,.jpeg,.webp"
        />
        <div class="form-text text-muted">
          Biarkan kosong jika tidak ingin mengganti gambar.
        </div>
      </div>

      <!-- Preview Gambar -->
      <div class="text-center mt-3">
        <img
          id="preview"
          src="{{ url_for('static', filename='images/tenant/' + tenant.gambar) }}"
          alt="Preview Gambar"
          class="rounded shadow-sm"
          style="max-width:150px; height:auto;"
        />
      </div>

      <!-- Tombol Submit -->
      <button type="submit" class="btn btn-primary w-100 py-2 mt-4 fw-semibold">
        <i class="bi bi-save me-1"></i> Simpan Perubahan
      </button>
    </form>
  </div>
</div>
{% endblock %}

{% block script %}
<script>
document.querySelector('input[name="gambar"]').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(event) {
      const img = document.getElementById('preview');
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }
});
</script>
{% endblock %}
