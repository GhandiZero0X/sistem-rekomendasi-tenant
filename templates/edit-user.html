<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Injourney</title>
  <link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='static_admin/images/logos/logo.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='static_admin/css/styles.min.css') }}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="body-wrapper">
      <header class="app-header">
        <nav class="navbar navbar-expand-lg navbar-light">
          <a href="{{ url_for('routes.dashboard_page') }}" class="text-nowrap logo-img d-flex align-items-center text-decoration-none">
            <img src="{{ url_for('static', filename='static_admin/images/logos/logo.png') }}" alt="Logo" class="img-fluid logo-icon me-2" />
            <span class="brand-text fw-semibold text-dark">Admin Injourney</span>
          </a>
          <div class="navbar-collapse justify-content-end px-0" id="navbarNav">
            <ul class="navbar-nav flex-row ms-auto align-items-center justify-content-end">
              <li class="nav-item">
                <a class="nav-link nav-icon-hover" href="javascript:void(0)" id="drop2" data-bs-toggle="dropdown"
                  aria-expanded="false">
                  <img src="{{ url_for('static', filename='static_admin/images/profile/user-1.jpg') }}" alt="" width="35" height="35" class="rounded-circle">
                </a>
                <div class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up" aria-labelledby="drop2">
                  <div class="message-body text-center">
                    <a href="{{ url_for('routes.login_page') }}" class="btn btn-logout-modern d-inline-flex align-items-center justify-content-center gap-2">
                      <iconify-icon icon="solar:logout-2-line-duotone" class="fs-5"></iconify-icon>
                      Logout
                    </a>
                  </div>
                </div>
              </li>
            </ul>
          </div>
        </nav>
      </header>

      <div class="container-fluid">
        <div class="card">
          <div class="card-body">
            <div class="d-flex align-items-center justify-content-between mb-5">
              <h5 class="card-title fw-semibold mb-0 d-flex align-items-center">
                <a href="{{ url_for('routes.user') }}" class="me-4">
                  <i class="bi bi-arrow-left-circle fs-5"></i>
                </a>
                Form Edit User
              </h5>
            </div>

            <div class="card-body pt-0">
              <form>
                <div class="mb-4">
                  <label for="exampleInputEmail1" class="form-label">Username</label>
                  <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                </div>

                <div class="mb-4">
                  <label for="exampleInputPassword1" class="form-label">Password</label>
                  <input type="password" class="form-control" id="exampleInputPassword1">
                </div>

                <div class="mb-4">
                  <label for="statusApproval" class="form-label">Status Approval</label>
                  <select class="form-select" id="statusApproval" name="statusApproval">
                    <option value="" selected disabled>Pilih Status</option>
                    <option value="disetujui">Disetujui</option>
                    <option value="menunggu">Menunggu</option>
                  </select>
                </div>

                <div class="mb-5">
                  <label for="roleUser" class="form-label">Role</label>
                  <select class="form-select" id="roleUser" name="roleUser">
                    <option value="" selected disabled>Pilih Role</option>
                    <option value="superadmin">Superadmin</option>
                    <option value="admin">Admin</option>
                  </select>
                </div>

                <a href="{{ url_for('routes.user') }}" class="btn btn-primary">Submit</a>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='static_admin/libs/jquery/dist/jquery.min.js') }}"></script>
  <script src="{{ url_for('static', filename='static_admin/libs/bootstrap/dist/js/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='static_admin/libs/simplebar/dist/simplebar.js') }}"></script>
  <script src="{{ url_for('static', filename='static_admin/js/sidebarmenu.js') }}"></script>
  <script src="{{ url_for('static', filename='static_admin/js/app.min.js') }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
</body>

</html>
